<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">ACS724 DC calibration</title>
  <desc id="desc">Measured ACS724 output voltage versus current with a linear least-squares fit. Fit: VOUT = 0.46910 + 0.74472 I, R squared equals 0.999997.</desc>
  <rect width="900" height="560" fill="white"/>
  <text x="450" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700">ACS724 DC calibration</text>
  <text x="450" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="13">Measured points and least-squares linear fit</text>

  <!-- plot area -->
  <line x1="90" y1="490" x2="840" y2="490" stroke="#222" stroke-width="1.5"/>
  <line x1="90" y1="50" x2="90" y2="490" stroke="#222" stroke-width="1.5"/>

  <!-- horizontal grid and y labels -->
  <g font-family="Arial, sans-serif" font-size="12" fill="#222">
    <g stroke="#ddd" stroke-width="1">
      <line x1="90" y1="490" x2="840" y2="490"/><line x1="90" y1="412.4" x2="840" y2="412.4"/><line x1="90" y1="334.7" x2="840" y2="334.7"/><line x1="90" y1="257.1" x2="840" y2="257.1"/><line x1="90" y1="179.4" x2="840" y2="179.4"/><line x1="90" y1="101.8" x2="840" y2="101.8"/><line x1="90" y1="50" x2="840" y2="50"/>
    </g>
    <text x="78" y="494" text-anchor="end">0.46</text>
    <text x="78" y="416.4" text-anchor="end">0.49</text>
    <text x="78" y="338.7" text-anchor="end">0.52</text>
    <text x="78" y="261.1" text-anchor="end">0.55</text>
    <text x="78" y="183.4" text-anchor="end">0.58</text>
    <text x="78" y="105.8" text-anchor="end">0.61</text>
    <text x="78" y="54" text-anchor="end">0.63</text>
  </g>

  <!-- vertical grid and x labels -->
  <g font-family="Arial, sans-serif" font-size="12" fill="#222">
    <g stroke="#ddd" stroke-width="1">
      <line x1="90" y1="50" x2="90" y2="490"/><line x1="260.5" y1="50" x2="260.5" y2="490"/><line x1="431" y1="50" x2="431" y2="490"/><line x1="601.4" y1="50" x2="601.4" y2="490"/><line x1="771.8" y1="50" x2="771.8" y2="490"/><line x1="840" y1="50" x2="840" y2="490"/>
    </g>
    <text x="90" y="510" text-anchor="middle">0.00</text>
    <text x="260.5" y="510" text-anchor="middle">0.05</text>
    <text x="431" y="510" text-anchor="middle">0.10</text>
    <text x="601.4" y="510" text-anchor="middle">0.15</text>
    <text x="771.8" y="510" text-anchor="middle">0.20</text>
    <text x="840" y="510" text-anchor="middle">0.22</text>
  </g>

  <!-- fit line -->
  <line x1="90" y1="466.4" x2="840" y2="42.4" stroke="#555" stroke-width="2.5"/>

  <!-- measured points -->
  <g fill="#111" stroke="white" stroke-width="1.5">
    <circle cx="90" cy="466.7" r="6"/>
    <circle cx="267.3" cy="365.8" r="6"/>
    <circle cx="451.4" cy="262.2" r="6"/>
    <circle cx="625.2" cy="163.9" r="6"/>
    <circle cx="799.1" cy="65.5" r="6"/>
  </g>

  <!-- annotations -->
  <g font-family="Arial, sans-serif" fill="#222">
    <text x="510" y="105" font-size="14" font-weight="700">VOUT = 0.46910 + 0.74472 · I</text>
    <text x="510" y="126" font-size="14">R² = 0.999997</text>
    <text x="465" y="548" text-anchor="middle" font-size="14" font-weight="700">Current I (A)</text>
    <text x="22" y="270" text-anchor="middle" font-size="14" font-weight="700" transform="rotate(-90 22 270)">ACS724 VOUT (V)</text>
  </g>

  <!-- legend -->
  <g font-family="Arial, sans-serif" font-size="12" fill="#222">
    <circle cx="112" cy="78" r="5" fill="#111"/>
    <text x="125" y="82">Measured</text>
    <line x1="195" y1="78" x2="225" y2="78" stroke="#555" stroke-width="2.5"/>
    <text x="233" y="82">Linear fit</text>
  </g>
</svg>
